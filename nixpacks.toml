
# Nixpacks configuration for Railway deployment
# Using Node.js 20 with tsx to avoid esbuild bundling issues

[phases.setup]
nixPkgs = ["nodejs-20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Simple build: client only, server runs with tsx
cmds = ["chmod +x railway-build-simple.sh", "./railway-build-simple.sh"]

[start]
# Run server with tsx directly to avoid esbuild bundling issues
cmd = "NODE_ENV=production npx tsx server/index.ts"
